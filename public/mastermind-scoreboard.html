<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/js/theme.js"></script>
  <meta name="theme-color" content="#f7f2e7">
  <title>Scorebord · Woordle</title>
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/scoreboard.css">
</head>
<body>
  <header class="site-header">
    <a href="/dashboard" class="home-link" aria-label="Naar het overzicht" title="Naar het overzicht">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    </a>
    <h1 class="site-title">Woordle</h1>
    <nav class="site-nav" aria-label="Woordle">
      <a href="/mastermind">Spelen</a>
      <a href="/mastermind/compare">Samenvatting</a>
      <a href="/mastermind/stats">Statistieken</a>
      <a href="/mastermind/scoreboard" aria-current="page">Scorebord</a>
    </nav>
  </header>

  <main class="page scoreboard">
    <section class="card" data-month-section>
      <h2 data-month></h2>
      <ol data-month-list class="score-list"></ol>
    </section>

    <section class="card winner-card" id="previous-month-winner">
      <h2 id="previous-month-winner-title"></h2>
      <p id="previous-month-winner-info"></p>
    </section>

    <section class="card">
      <h2>Gewonnen maanden</h2>
      <ol id="highest-scorer-list" class="score-list"></ol>
    </section>

    <section class="card">
      <h2>Hoogste maandscores ooit</h2>
      <ol id="top-monthly-scores-list" class="score-list"></ol>
    </section>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/scoreboard.js"></script>
</body>
</html>
