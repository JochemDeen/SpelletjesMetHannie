<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f2e7">
  <title>Inloggen · Spelletjes met Hannie</title>
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>
  <main class="login-container card">
    <img class="login-logo" src="/apple-touch-icon.png" alt="" width="72" height="72">
    <h1>Spelletjes met Hannie</h1>
    <form action="/login" method="POST">
      <label for="username">Gebruikersnaam</label>
      <input class="input" type="text" id="username" name="username" autocomplete="username" autocapitalize="none" required>
      <label for="password">Wachtwoord</label>
      <input class="input" type="password" id="password" name="password" autocomplete="current-password" required>
      <button class="btn btn-primary btn-block" type="submit">Inloggen</button>
    </form>
    <p id="error-message" class="error" role="alert"></p>
  </main>
  <script>
    // Show the reason for a failed login (?error=1 or ?error=locked)
    const error = new URLSearchParams(window.location.search).get('error');
    if (error) {
      document.getElementById('error-message').textContent = error === 'locked'
        ? 'Te veel mislukte pogingen. Probeer het over een uur opnieuw.'
        : 'Ongeldige gebruikersnaam of wachtwoord.';
    }
  </script>
</body>
</html>
