  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/wie-ben-ik/css/wie-ben-ik.css">
  <link rel="stylesheet" href="/wie-ben-ik/css/wie-ben-ik-personages.css">
</head>
<body>
  <header class="site-header">
    <a href="/dashboard" class="home-link" aria-label="Naar het overzicht" title="Naar het overzicht">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    </a>
    <h1 class="site-title">Wie ben ik?</h1>
    <nav class="site-nav" aria-label="Wie ben ik">
      <a href="/wie-ben-ik">Spelen</a>
      <a href="/wie-ben-ik/scoreboard">Scorebord</a>
      <a href="/wie-ben-ik/personages" aria-current="page">Personages</a>
    </nav>
  </header>

  <main class="page wbi-page">
    <!-- Shown while a game is live (or when loading fails) -->
    <div id="blocked-container" class="hidden">
        <div class="waiting-spinner">🙈</div>
        <p id="blocked-message">De personagelijst is niet beschikbaar tijdens een spel.</p>
    </div>

    <!-- The browser: pick a theme, see its characters -->
    <div id="browser-container" class="hidden">
        <p class="subtitle">Kies een thema om te zien welke personages erin zitten.</p>
        <select id="theme-select"></select>
        <p id="theme-count" class="subtitle"></p>
        <div id="characters-list"></div>
    </div>

  </main>

    <script src="/js/common.js"></script>
    <script src="/wie-ben-ik/js/wie-ben-ik-personages.js"></script>
</body>
