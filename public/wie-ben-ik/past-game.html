<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/js/theme.js"></script>
  <meta name="theme-color" content="#f7f2e7">
  <title>Vorige spellen · Wie ben ik?</title>
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/wie-ben-ik/css/wie-ben-ik.css">
  <link rel="stylesheet" href="/wie-ben-ik/css/past-game.css">
</head>
<body>
  <header class="site-header">
    <a href="/dashboard" class="home-link" aria-label="Naar het overzicht" title="Naar het overzicht">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    </a>
    <h1 class="site-title">Wie ben ik?</h1>
    <nav class="site-nav" aria-label="Wie ben ik">
      <a href="/wie-ben-ik">Spelen</a>
      <a href="/wie-ben-ik/scoreboard">Scorebord</a>
      <a href="/wie-ben-ik/personages">Personages</a>
    </nav>
  </header>

  <main class="page wbi-page">
    <div class="date-navigation">
        <button id="prevDateButton" class="btn btn-secondary nav-arrow" aria-label="Vorig spel">‹</button>
        <span id="game-info"></span>
        <button id="nextDateButton" class="btn btn-secondary nav-arrow" aria-label="Volgend spel">›</button>
    </div>

    <div id="game-state-container">
        <div id="winner-banner" class="hidden"></div>

        <!-- All players with their characters revealed -->
        <div id="players-container">
            <h3>De personages</h3>
            <div id="players-list"></div>
        </div>

        <!-- Full question history with vote counts -->
        <div id="history-container">
            <h3>Vragen en antwoorden</h3>
            <table>
              <thead>
                <tr>
                  <th title="Ronde">#</th>
                  <th>Speler</th>
                  <th>Vraag</th>
                  <th>Ja</th>
                  <th>Nee</th>
                  <th>?</th>
                </tr>
              </thead>
              <tbody id="historyTableBody"></tbody>
            </table>
        </div>
    </div>

  </main>

    <script src="/js/common.js"></script>
    <script src="/wie-ben-ik/js/past-game.js"></script>
</body>
</html>
