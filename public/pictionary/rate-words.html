<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f2e7">
  <title>Woorden beoordelen · Pictionary</title>
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/pictionary/css/rate-words.css">
</head>
<body>
  <header class="site-header">
    <a href="/dashboard" class="home-link" aria-label="Naar het overzicht" title="Naar het overzicht">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    </a>
    <h1 class="site-title">Woorden beoordelen</h1>
    <nav class="site-nav" aria-label="Pictionary">
      <a href="/pictionary">Spelen</a>
      <a href="/pictionary/scoreboard">Scorebord</a>
    </nav>
  </header>

  <main class="page" style="max-width: 600px;">
    <div class="info-box">
      <p>
        Beoordeel de moeilijkheidsgraad van deze woorden voor Pictionary. Je kunt ook nieuwe woorden voorstellen!
      </p>
    </div>

    <!-- Word Rating Section -->
    <div class="rating-section" id="ratingSection">
      <div class="card word-card">
        <div id="wordToRate" class="word-to-rate">Laden...</div>
        <div class="rating-options">
          <button class="rating-btn" data-rating="easy">Gemakkelijk</button>
          <button class="rating-btn" data-rating="medium">Gemiddeld</button>
          <button class="rating-btn" data-rating="hard">Moeilijk</button>
          <button class="rating-btn drop-btn" data-rating="drop">Woord Verwijderen</button>
        </div>
        <div class="rating-controls">
          <button id="skipBtn" class="text-btn">
            Overslaan ⏭
          </button>
        </div>
      </div>
      
      <div class="rating-progress">
        <span id="ratedCount">0</span> woorden beoordeeld
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <!-- Word Suggestion Section -->
    <div class="divider">
      <span>OF</span>
    </div>

    <div class="suggestion-section">
      <h2>Stel een nieuw woord voor</h2>
      <div class="card suggestion-card">
        <div class="suggestion-form">
          <div class="form-group">
            <label for="suggestedWord">Woord</label>
            <input class="input" type="text" id="suggestedWord" placeholder="Voer een woord in">
          </div>
          <div class="form-group">
            <label>Geschatte moeilijkheidsgraad</label>
            <div class="suggestion-options">
              <label class="suggestion-option">
                <input type="radio" name="difficulty" value="easy" checked>
                <span>Gemakkelijk</span>
              </label>
              <label class="suggestion-option">
                <input type="radio" name="difficulty" value="medium">
                <span>Gemiddeld</span>
              </label>
              <label class="suggestion-option">
                <input type="radio" name="difficulty" value="hard">
                <span>Moeilijk</span>
              </label>
            </div>
          </div>
          <button id="suggestBtn" class="btn btn-primary">Woord voorstellen</button>
        </div>
        <div id="suggestionMessage" class="suggestion-message"></div>
      </div>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.js" integrity="sha384-qmDHVszK26iWDlfhGzXz71t2qRopa/FvIuOkCTJJT4QRkIZf9h+OiJZzco9XtgPX" crossorigin="anonymous"></script>

  <script src="/pictionary/js/rate-words.js"></script>
</body>
</html>
