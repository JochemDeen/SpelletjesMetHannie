<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/js/theme.js"></script>
  <meta name="theme-color" content="#f7f2e7">
  <title>Pictionary</title>
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/pictionary/css/pictionary.css">
</head>
<body>
  <header class="site-header">
    <a href="/dashboard" class="home-link" aria-label="Naar het overzicht" title="Naar het overzicht">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    </a>
    <h1 class="site-title">Pictionary</h1>
    <nav class="site-nav" aria-label="Pictionary">
      <a href="/pictionary" aria-current="page">Spelen</a>
      <a href="/pictionary/scoreboard">Scorebord</a>
    </nav>
  </header>

  <main class="page pictionary-page">
    <h2 id="phase-title" class="phase-title"></h2>

    <!-- Not playing / waiting for the drawer -->
    <section id="off-container" class="card message-card hidden">
      <div class="message-icon" id="off-icon">🎨</div>
      <p id="off-message"></p>
    </section>

    <!-- Drawer: choose a difficulty -->
    <section id="word-selection" class="card hidden">
      <p class="muted">Hoe moeilijker het woord, hoe meer punten je kunt verdienen.</p>
      <div id="difficulty-options" class="difficulty-options"></div>
    </section>

    <!-- Drawer: think about the drawing -->
    <section id="thinking-container" class="card hidden">
      <p class="word-reveal">Je woord is: <strong id="thinking-word" class="highlight-word"></strong></p>
      <p class="muted">Bedenk even hoe je het gaat tekenen. Het tekenen begint vanzelf over <strong id="thinking-timer">1:00</strong>.</p>
      <button type="button" id="start-drawing-btn" class="btn btn-primary btn-block">Start met tekenen!</button>
    </section>

    <!-- Drawer: drawing (also used for the touch-up) -->
    <section id="drawing-container" class="hidden">
      <div class="draw-header">
        <p class="draw-word">Teken: <strong id="draw-word" class="highlight-word"></strong></p>
        <span id="timer-text" class="timer-text" aria-live="off">1:00</span>
      </div>
      <div class="timer-track"><div id="timer-bar" class="timer-bar"></div></div>

      <div class="canvas-frame">
        <canvas id="drawing-canvas" width="800" height="400" aria-label="Tekenvel"></canvas>
      </div>

      <div class="toolbar" id="toolbar">
        <div class="swatches" role="group" aria-label="Kleur">
          <button type="button" class="swatch active" data-color="#1f1f1f" style="--swatch: #1f1f1f" aria-label="zwart" title="zwart"></button>
          <button type="button" class="swatch" data-color="#8e8e93" style="--swatch: #8e8e93" aria-label="grijs" title="grijs"></button>
          <button type="button" class="swatch" data-color="#ffffff" style="--swatch: #ffffff" aria-label="wit" title="wit"></button>
          <button type="button" class="swatch" data-color="#ff453a" style="--swatch: #ff453a" aria-label="rood" title="rood"></button>
          <button type="button" class="swatch" data-color="#ff9500" style="--swatch: #ff9500" aria-label="oranje" title="oranje"></button>
          <button type="button" class="swatch" data-color="#ffcc00" style="--swatch: #ffcc00" aria-label="geel" title="geel"></button>
          <button type="button" class="swatch" data-color="#34c759" style="--swatch: #34c759" aria-label="groen" title="groen"></button>
          <button type="button" class="swatch" data-color="#5ac8fa" style="--swatch: #5ac8fa" aria-label="lichtblauw" title="lichtblauw"></button>
          <button type="button" class="swatch" data-color="#007aff" style="--swatch: #007aff" aria-label="blauw" title="blauw"></button>
          <button type="button" class="swatch" data-color="#af52de" style="--swatch: #af52de" aria-label="paars" title="paars"></button>
          <button type="button" class="swatch" data-color="#ffb6c1" style="--swatch: #ffb6c1" aria-label="roze" title="roze"></button>
          <button type="button" class="swatch" data-color="#a27653" style="--swatch: #a27653" aria-label="bruin" title="bruin"></button>
        </div>
        <div class="tool-row">
          <div class="tool-group" role="group" aria-label="Gereedschap">
            <button type="button" class="tool-btn active" data-tool="pen" aria-label="Potlood" title="Potlood">✏️</button>
            <button type="button" class="tool-btn" data-tool="fill" aria-label="Verfemmer: vlak inkleuren" title="Vlak inkleuren">🪣</button>
            <button type="button" class="tool-btn" data-tool="eraser" aria-label="Gum" title="Gum"><img src="/images/eraser-icon.png" alt=""></button>
          </div>
          <div class="tool-group" role="group" aria-label="Diktes">
            <button type="button" class="size-btn" data-size="2" aria-label="Dun" title="Dun"><span style="--dot: 4px"></span></button>
            <button type="button" class="size-btn active" data-size="6" aria-label="Normaal" title="Normaal"><span style="--dot: 8px"></span></button>
            <button type="button" class="size-btn" data-size="12" aria-label="Dik" title="Dik"><span style="--dot: 14px"></span></button>
            <button type="button" class="size-btn" data-size="24" aria-label="Heel dik" title="Heel dik"><span style="--dot: 22px"></span></button>
          </div>
          <div class="tool-group" role="group" aria-label="Geschiedenis">
            <button type="button" class="tool-btn" id="undo-button" aria-label="Ongedaan maken" title="Ongedaan maken">↶</button>
            <button type="button" class="tool-btn" id="redo-button" aria-label="Opnieuw" title="Opnieuw">↷</button>
            <button type="button" class="tool-btn" id="clear-button" aria-label="Wis alles" title="Wis alles">🗑️</button>
          </div>
        </div>
      </div>

      <button type="button" id="finish-drawing" class="btn btn-primary btn-block finish-btn">Klaar!</button>
    </section>

    <!-- Guessers (and the drawer while waiting): the drawing -->
    <section id="guess-container" class="card hidden">
      <p id="drawing-caption" class="drawing-caption"></p>
      <div id="image-canvas" class="drawing-view"></div>
      <form id="guess-submission" class="guess-form hidden">
        <label for="guess-input" class="visually-hidden">Jouw gok</label>
        <input class="input" type="text" id="guess-input" maxlength="200" autocomplete="off" placeholder="Wat is het?">
        <button type="submit" id="submit-guess" class="btn btn-primary">Raad</button>
      </form>
      <p id="guess-waiting" class="muted guess-waiting hidden"></p>
    </section>

    <!-- Drawer: grade the guesses -->
    <section id="grading-guesses" class="card hidden">
      <p class="word-reveal">Je tekende: <strong id="grading-word" class="highlight-word"></strong></p>
      <div id="image-canvas-guessing" class="drawing-view"></div>
      <button type="button" id="modify-drawing" class="btn btn-secondary btn-block">✏️ Maak een kleine aanpassing</button>
      <div class="grading-legend"><span>1 = helemaal fout</span><span>5 = goed!</span></div>
      <div id="guesses-list"></div>
      <button type="button" id="submit-grades" class="btn btn-primary btn-block">Beoordelen</button>
    </section>

    <!-- All guesses of this game -->
    <section id="guesses-table-container" class="card hidden">
      <h3>De gokken</h3>
      <div class="table-scroll">
        <table class="guess-table">
          <thead>
            <tr>
              <th title="Ronde">#</th>
              <th>Speler</th>
              <th>Tijd</th>
              <th>Gok</th>
              <th>Cijfer</th>
            </tr>
          </thead>
          <tbody id="guessesTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/js/common.js"></script>
  <script src="/pictionary/js/drawing-board.js"></script>
  <script src="/pictionary/js/pictionary.js"></script>
</body>
</html>
