<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/js/theme.js"></script>
  <meta name="theme-color" content="#f7f2e7">
  <title>Instellingen · Spelletjes met Hannie</title>
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/settings.css">
</head>
<body>
  <header class="site-header">
    <a href="/dashboard" class="home-link" aria-label="Naar het overzicht" title="Naar het overzicht">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    </a>
    <h1 class="site-title">Instellingen</h1>
  </header>

  <main class="page">
    <section class="card">
      <h2 class="settings-heading">Meedoen</h2>
      <p class="muted">Een nieuw potje start met iedereen die hier aan staat.</p>
      <label class="toggle-row" for="pictionaryToggle">
        <span class="toggle-label">Pictionary</span>
        <span class="switch">
          <input type="checkbox" id="pictionaryToggle" role="switch">
          <span class="slider" aria-hidden="true"></span>
        </span>
      </label>
      <label class="toggle-row" for="wieBenIkToggle">
        <span class="toggle-label">Wie ben ik?</span>
        <span class="switch">
          <input type="checkbox" id="wieBenIkToggle" role="switch">
          <span class="slider" aria-hidden="true"></span>
        </span>
      </label>
      <p class="muted settings-note">Woordle kun je altijd spelen.</p>
    </section>
    <section class="card">
      <h2 class="settings-heading">Meldingen</h2>
      <p class="muted">Een seintje als je aan de beurt bent, ook als de site dicht is.</p>
      <label class="toggle-row" for="pushToggle">
        <span class="toggle-label">Meldingen op dit apparaat</span>
        <span class="switch">
          <input type="checkbox" id="pushToggle" role="switch" disabled>
          <span class="slider" aria-hidden="true"></span>
        </span>
      </label>
      <p class="muted settings-note" id="pushNote" hidden></p>
      <div id="notifyOptions">
        <p class="muted settings-note">Waarvoor? Dit geldt voor al je apparaten.</p>
        <label class="toggle-row" for="notifyPictionaryToggle">
          <span class="toggle-label">Pictionary: jij bent aan de beurt</span>
          <span class="switch">
            <input type="checkbox" id="notifyPictionaryToggle" role="switch">
            <span class="slider" aria-hidden="true"></span>
          </span>
        </label>
        <label class="toggle-row" for="notifyWieBenIkToggle">
          <span class="toggle-label">Wie ben ik: jij bent aan de beurt</span>
          <span class="switch">
            <input type="checkbox" id="notifyWieBenIkToggle" role="switch">
            <span class="slider" aria-hidden="true"></span>
          </span>
        </label>
        <label class="toggle-row" for="notifyWoordleToggle">
          <span class="toggle-label">Woordle: herinnering om 10 uur<small class="toggle-hint">als je nog niet gespeeld hebt</small></span>
          <span class="switch">
            <input type="checkbox" id="notifyWoordleToggle" role="switch">
            <span class="slider" aria-hidden="true"></span>
          </span>
        </label>
        <label class="toggle-row" for="notifyResultsToggle">
          <span class="toggle-label">Uitslag als een spel klaar is</span>
          <span class="switch">
            <input type="checkbox" id="notifyResultsToggle" role="switch">
            <span class="slider" aria-hidden="true"></span>
          </span>
        </label>
        <button type="button" class="btn btn-secondary btn-block push-test" id="pushTest" hidden>Stuur een testmelding</button>
      </div>
    </section>
    <section class="card">
      <h2 class="settings-heading">Weergave</h2>
      <p class="muted">Geldt voor dit apparaat.</p>
      <div class="theme-choice" role="radiogroup" aria-label="Weergave">
        <label class="theme-option-label">
          <input type="radio" name="theme" value="system">
          <span><span class="theme-choice-icon" aria-hidden="true">🌗</span>Automatisch<small>zoals je apparaat</small></span>
        </label>
        <label class="theme-option-label">
          <input type="radio" name="theme" value="light">
          <span><span class="theme-choice-icon" aria-hidden="true">☀️</span>Licht</span>
        </label>
        <label class="theme-option-label">
          <input type="radio" name="theme" value="dark">
          <span><span class="theme-choice-icon" aria-hidden="true">🌙</span>Donker</span>
        </label>
      </div>
    </section>
    <p class="settings-links"><a href="/logout">Uitloggen</a></p>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/push.js"></script>
  <script src="/js/settings.js"></script>
</body>
</html>
